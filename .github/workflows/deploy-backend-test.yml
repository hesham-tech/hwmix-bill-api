name: Deploy Laravel Backend to Test Subdomain (SSH)

on:
  push:
    branches:
      - restructure-v2 # هذا هو البرانش الذي تعمل عليه حالياً

jobs:
  deploy:
    environment: legacy-testing
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reject tracked secret material
        run: python3 tools/security/scan_tracked_secrets.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Configure trusted SSH host
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.LEGACY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LEGACY_SSH_PRIVATE_KEY }}

      - name: Ensure Remote Directory Exists
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=15 -o ConnectionAttempts=1 u715355537@212.107.17.234 "mkdir -p /home/u715355537/domains/hwnix.com/public_html/api-teste/"

      - name: Deploy via Rsync
        run: |
          rsync -avz --delete -e "ssh -p 65002 -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=15 -o ConnectionAttempts=1" \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='node_modules/' \
          --exclude='tests/' \
          --exclude='storage/' \
          --exclude='public/storage' \
          --exclude='.env' \
          --exclude='phpunit.xml' \
          --exclude='README.md' \
          ./ u715355537@212.107.17.234:/home/u715355537/domains/hwnix.com/public_html/api-teste/

      - name: Run Database Migrations
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=15 -o ConnectionAttempts=1 u715355537@212.107.17.234 "cd /home/u715355537/domains/hwnix.com/public_html/api-teste && php artisan migrate --force"

      - name: Clear All Caches
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=15 -o ConnectionAttempts=1 u715355537@212.107.17.234 "cd /home/u715355537/domains/hwnix.com/public_html/api-teste && php artisan cache:clear && php artisan config:clear && php artisan route:clear && php artisan view:clear && php artisan event:clear"

      - name: Rebuild Composer Autoloader
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=15 -o ConnectionAttempts=1 u715355537@212.107.17.234 "cd /home/u715355537/domains/hwnix.com/public_html/api-teste && composer dump-autoload -o"

      - name: Optimize for Production
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=15 -o ConnectionAttempts=1 u715355537@212.107.17.234 "cd /home/u715355537/domains/hwnix.com/public_html/api-teste && php artisan config:cache && php artisan route:cache && php artisan optimize"

      - name: Deployment Complete
        run: echo "✅ Deployment successful! Migrations run, caches cleared, and application optimized."
