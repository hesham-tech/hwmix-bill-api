name: Deployment secret checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/security -p 'test_*.py'
      - run: python3 tools/security/scan_tracked_secrets.py
