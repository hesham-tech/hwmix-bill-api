name: Verify deployment credentials
on:
  push:
    branches: [codex/audit-phase-02-deploy-secrets]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to verify without deploying application code
        required: true
        type: choice
        options: [production, legacy-testing]
        default: production
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["production","legacy-testing"]') }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secret material
        run: python3 tools/security/scan_tracked_secrets.py
      - name: Verify dedicated key and trusted host without application commands
        env:
          DEPLOY_KEY: ${{ matrix.environment == 'production' && secrets.PRODUCTION_SSH_PRIVATE_KEY || secrets.LEGACY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ matrix.environment == 'production' && secrets.PRODUCTION_SSH_KNOWN_HOSTS || secrets.LEGACY_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ matrix.environment == 'production' && vars.PRODUCTION_SSH_HOST || vars.LEGACY_SSH_HOST }}
          SSH_USER: ${{ matrix.environment == 'production' && vars.PRODUCTION_SSH_USER || vars.LEGACY_SSH_USER }}
          SSH_PORT: ${{ matrix.environment == 'production' && vars.PRODUCTION_SSH_PORT || vars.LEGACY_SSH_PORT }}
          TARGET: ${{ matrix.environment == 'production' && '/home/u715355537/domains/hwnix.com/public_html/bill-api' || '/home/u715355537/domains/hwnix.com/public_html/api-teste' }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/verify_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/verify_deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/verify_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=20 -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "test \"\$(whoami)\" = u715355537 && test -d '$TARGET' && printf 'dedicated-credential-ok\\n'"
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null 2>&1 || true' EXIT
          ssh-add ~/.ssh/verify_deploy > /dev/null
          CHECK_NAME="credential-check-${GITHUB_RUN_ID}.txt"
          printf 'credential-check-only\n' > "$RUNNER_TEMP/$CHECK_NAME"
          rsync --archive --dry-run --itemize-changes \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no" \
            "$RUNNER_TEMP/$CHECK_NAME" "$SSH_USER@$SSH_HOST:$TARGET/"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "test ! -e '$TARGET/$CHECK_NAME' && printf 'agent-dry-run-ok\\n'"
      - name: Remove ephemeral key
        if: always()
        run: rm -f ~/.ssh/verify_deploy
